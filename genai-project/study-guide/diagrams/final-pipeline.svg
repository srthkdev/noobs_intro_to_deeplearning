<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 370" role="group" aria-label="Exact final inference pipeline"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#668177"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#263f38}.title{font-size:15px;font-weight:bold}.sub{font-size:12px;fill:#577168}.tiny{font-size:11px;fill:#6c8077}.wire{fill:none;stroke:#668177;stroke-width:1.7;marker-end:url(#arrow)}.skip{fill:none;stroke:#be7951;stroke-width:1.7;stroke-dasharray:6 4;marker-end:url(#arrow)}</style><title>Exact final inference pipeline</title><g data-detail="pipe:image" tabindex="0" role="button" aria-label="Native grayscale: 1 × 128 × 800"><rect x="20" y="45" width="215" height="70" rx="8" fill="#e7f1eb" stroke="#bdcec2"/><text x="33" y="69" class="title">Native grayscale</text><text x="33" y="90" class="sub">1 × 128 × 800</text></g><path d="M235 80 H260" class="wire"/><g data-detail="pipe:normalize" tabindex="0" role="button" aria-label="Preprocess: /255; (x − 0.5) / 0.25"><rect x="260" y="45" width="215" height="70" rx="8" fill="#e7f1eb" stroke="#bdcec2"/><text x="273" y="69" class="title">Preprocess</text><text x="273" y="90" class="sub">/255; (x − 0.5) / 0.25</text></g><path d="M475 80 H500" class="wire"/><g data-detail="pipe:models" tabindex="0" role="button" aria-label="Three trained models: four logits per pixel"><rect x="500" y="45" width="215" height="70" rx="8" fill="#e7f1eb" stroke="#bdcec2"/><text x="513" y="69" class="title">Three trained models</text><text x="513" y="90" class="sub">four logits per pixel</text></g><path d="M715 80 H740" class="wire"/><g data-detail="pipe:probability" tabindex="0" role="button" aria-label="Sigmoid + cache precision: per-model float16 maps"><rect x="740" y="45" width="215" height="70" rx="8" fill="#e7f1eb" stroke="#bdcec2"/><text x="753" y="69" class="title">Sigmoid + cache precision</text><text x="753" y="90" class="sub">per-model float16 maps</text></g><path d="M847 115 V240" class="wire"/><g data-detail="pipe:mean" tabindex="0" role="button" aria-label="Equal probability mean: float32 sum → float16"><rect x="740" y="240" width="215" height="70" rx="8" fill="#e7f1eb" stroke="#bdcec2"/><text x="753" y="264" class="title">Equal probability mean</text><text x="753" y="285" class="sub">float32 sum → float16</text></g><path d="M740 275 H715" class="wire"/><g data-detail="pipe:threshold" tabindex="0" role="button" aria-label="Class thresholds: 0.35 each; p ≥ T"><rect x="500" y="240" width="215" height="70" rx="8" fill="#e7f1eb" stroke="#bdcec2"/><text x="513" y="264" class="title">Class thresholds</text><text x="513" y="285" class="sub">0.35 each; p ≥ T</text></g><path d="M500 275 H475" class="wire"/><g data-detail="pipe:area" tabindex="0" role="button" aria-label="Component filtering: 4-connected; class areas"><rect x="260" y="240" width="215" height="70" rx="8" fill="#e7f1eb" stroke="#bdcec2"/><text x="273" y="264" class="title">Component filtering</text><text x="273" y="285" class="sub">4-connected; class areas</text></g><path d="M260 275 H235" class="wire"/><g data-detail="pipe:rle" tabindex="0" role="button" aria-label="Column-major RLE: preserve image/class IDs"><rect x="20" y="240" width="215" height="70" rx="8" fill="#e7f1eb" stroke="#bdcec2"/><text x="33" y="264" class="title">Column-major RLE</text><text x="33" y="285" class="sub">preserve image/class IDs</text></g></svg>